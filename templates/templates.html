<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Templates</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="landing-shell">
      <header class="landing-header">
        <div>
          <p class="eyebrow">County One LNA</p>
          <h1>Edit Templates</h1>
        </div>
        <div class="landing-actions">
          <a class="header-action secondary-link" href="/">Landing</a>
          <button id="add-template" class="header-action" type="button">Add template</button>
          <button id="save-templates" class="header-action" type="button">Save</button>
        </div>
      </header>

      <section id="template-editor" class="template-editor">
        {% for name, config in templates.items() %}
          <div class="template-row">
            <label>Template name<input name="name" value="{{ name }}"></label>
            <label>Config JSON<textarea name="config">{{ config | tojson(indent=2) }}</textarea></label>
            <button class="duplicate-template" type="button">Copy</button>
            <button class="remove-template" type="button">Remove</button>
          </div>
        {% endfor %}
      </section>
      <div id="template-save-status" class="scan-status">Ready</div>
    </main>
    <script src="/static/templates.js"></script>
  </body>
</html>
